name: Package Classroom App

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: feric-linux-x64
            arch: x64
          - os: ubuntu-22.04-arm
            artifact: feric-linux-arm64
            arch: arm64
          - os: windows-latest
            artifact: feric-windows-x64
            arch: x64
          - os: macos-latest
            artifact: feric-macos-arm64
            arch: arm64
          - os: macos-15-intel
            artifact: feric-macos-x64
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Package native app image
        if: runner.os != 'Windows'
        run: sh scripts/package.sh "${{ matrix.arch }}"
      - name: Package native app image
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\package.ps1 -Architecture "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: feric-*
          path: release-assets
          merge-multiple: true
      - name: Publish downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/*.zip --generate-notes
